<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembretes de Aniversário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- O tabindex torna o h1 focável -->
  <h1 id="topo" tabindex="-1">Lembretes de Aniversário 🎂</h1>

  <!-- Região para mensagens acessíveis -->
  <div id="mensagem" aria-live="assertive" role="alert"></div>

  <h2>Lista de Pessoas</h2>
  <ul id="lista"></ul>

  <h2>Cadastrar Nova Pessoa</h2>
  <form id="formCadastro">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="dataNascimento">Data de Nascimento:</label>
    <input type="date" id="dataNascimento" name="dataNascimento" required>

    <label for="grupo">Grupo:</label>
    <select id="grupo" name="grupo" required>
      <option value="">Selecione...</option>
      <option value="1">Grupo 1</option>
      <option value="2">Grupo 2</option>
    </select>

    <label for="presente">Presente:</label>
    <input type="text" id="presente" name="presente">

    <button type="submit" disabled>Cadastrar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
